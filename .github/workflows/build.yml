name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        run: |
          git clone https://github.com/pke1997/KsK-Memo.git .

      - name: Set up Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter
          echo "$PWD/_flutter/bin" >> $GITHUB_PATH

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Prepare APK Directory
        run: |
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/app-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: output_apk/app-release.apk
